<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="TRACE — the room gets loud before the chart moves" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0D11"/>
      <stop offset="1" stop-color="#07080A"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DBFD52" fill-opacity="0.09"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#fade)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="#242A35"/>

  <!-- wordmark -->
  <circle cx="64" cy="70" r="5" fill="#DBFD52" filter="url(#glow)"/>
  <text x="84" y="79" font-family="Helvetica Neue,Arial,sans-serif" font-size="30"
        font-weight="900" letter-spacing="9" fill="#E9E7E0">TRACE</text>
  <text x="84" y="112" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13"
        letter-spacing="3.4" fill="#565D69">READ-ONLY TERMINAL · ROBINHOOD CHAIN · ID 4663</text>

  <text x="64" y="176" font-family="Helvetica Neue,Arial,sans-serif" font-size="40"
        font-weight="800" letter-spacing="-1" fill="#E9E7E0">The room gets loud</text>
  <text x="64" y="222" font-family="Helvetica Neue,Arial,sans-serif" font-size="40"
        font-weight="800" letter-spacing="-1" fill="#DBFD52">before the chart moves.</text>

  <text x="64" y="268" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13"
        fill="#858C98">Counts posts per five-minute window against what a token</text>
  <text x="64" y="288" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13"
        fill="#858C98">that age normally gets. No score. No target. No buy button.</text>

  <!-- the real run: $HODLster, 9 Sep 2026, posts per 5-minute window -->
  <g transform="translate(700,96)">
    <text x="0" y="-16" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5"
          letter-spacing="2.2" fill="#565D69">$HODLSTER · 9 SEP 2026 · POSTS PER 5 MIN</text>

    <line x1="0" y1="150" x2="430" y2="150" stroke="#242A35"/>
    <!-- normal for a token this age: 1.55 posts a window -->
    <line x1="0" y1="135.5" x2="430" y2="135.5" stroke="#5F8B96" stroke-width="1.2"
          stroke-dasharray="2 5"/>
    <text x="434" y="139" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5"
          fill="#5F8B96">1.55</text>

    <!-- rate values 13 11 14 3 1 3 2 3 1, 10px per unit -->
    <rect x="6"   y="20"  width="26" height="130" rx="2" fill="#5F8B96" fill-opacity=".5"/>
    <rect x="42"  y="40"  width="26" height="110" rx="2" fill="#5F8B96" fill-opacity=".5"/>
    <rect x="78"  y="10"  width="26" height="140" rx="2" fill="#FF5A3C" filter="url(#glow)"/>
    <rect x="114" y="120" width="26" height="30"  rx="2" fill="#DBFD52" fill-opacity=".8"/>
    <rect x="150" y="140" width="26" height="10"  rx="2" fill="#5F8B96" fill-opacity=".5"/>
    <rect x="186" y="120" width="26" height="30"  rx="2" fill="#DBFD52" fill-opacity=".8"/>
    <rect x="222" y="130" width="26" height="20"  rx="2" fill="#5F8B96" fill-opacity=".5"/>
    <rect x="258" y="120" width="26" height="30"  rx="2" fill="#5F8B96" fill-opacity=".5"/>
    <rect x="294" y="140" width="26" height="10"  rx="2" fill="#5F8B96" fill-opacity=".5"/>
    <rect x="330" y="145" width="26" height="5"   rx="2" fill="#5F8B96" fill-opacity=".35"/>
    <rect x="366" y="145" width="26" height="5"   rx="2" fill="#5F8B96" fill-opacity=".35"/>

    <text x="78" y="-2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12"
          font-weight="600" fill="#FF5A3C">14 posts · 11 accounts · 9.0×</text>

    <text x="6"   y="166" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#565D69">+1m</text>
    <text x="150" y="166" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#565D69">+21m</text>
    <text x="294" y="166" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#565D69">+41m</text>
  </g>
</svg>
